<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="css/global.css">
</head>

<body>
    <div class="container">
        <h1>Login</h1>
        <div class="box">
            <div class="componente" id="useremail">
                <label for="email">e-mail</label>
                <input type="email" name="email" id="email" placeholder="email">
            </div>
            <div>
                <div class="componente" id="userpass">
                    <label for="senha">Senha</label>
                    <input type="password" name="senha" id="senha" placeholder="password">
                </div>
            </div>

            <button class="botao confirma" type="button">Login</button>
            <button class="botao novo">Cadastrar</button>
        </div>
    </div>
    <div class="footer">
        <h2>Rodape</h2>
    </div>
</body>

</html>
